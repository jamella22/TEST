global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devops-sre-lab'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - host metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # cAdvisor - container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Sample application
  - job_name: 'sample_app'
    static_configs:
      - targets: ['sample_app:80']
  
  # NODE 2: Ubuntu Lab Server
  - job_name: 'node-2'
    static_configs:
      - targets: ['node-exporter-2:9100']
        labels:
          node: 'ubuntu-node'
          environment: 'lab'

